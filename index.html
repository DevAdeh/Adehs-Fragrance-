<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adeh's Fragrance - Luxury Scents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top-bar">
  <p class="logo">Adeh's Fragrance</p>
  <a href="cart.html" class="cart-link">🛒 Cart (<span id="cartCount">0</span>)</a>
</div>
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-text">
      <p class="eyebrow">Adeh's Fragrance</p>
      <h1>Luxury in<br>Every Spray</h1>
      <p class="hero-sub">Make Your Presence Known — designer perfumes, mists, diffusers &amp; more.</p>
      <a href="#products" class="btn-primary">Explore Collection</a>
    </div>
    <div class="hero-image">
     <img src="assets/poison.png" alt="Featured fragrance bottle">
    </div>
  </section>

  <!-- Products Section -->
  <section id="products" class="products-section">
    <p class="eyebrow center">Our Collection</p>
    <h2 class="section-title">Shop By Category</h2>

    <div class="filters" id="filters"></div>
    <div class="grid" id="productGrid"></div>
  </section>

  <!-- Footer -->
  <footer>
    <p class="footer-brand">Adeh's Fragrance</p>
    <p>📞 09165924915 &nbsp;|&nbsp; 📍 University of Ibadan, Ibadan</p>
    Coded by
    <a href="https://github.com/DevAdeh">
      DevAdeh 
    </a>.
  </footer>

  <script src="script.js"></script>
</body>
</html>
